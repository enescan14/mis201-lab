<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navigator">
        <a href="index.html">Home</a> 
        <a href="about.html">About</a> 
        <a href="courses.html">Courses</a> 
        <a href="contact.html">Contact</a>
    </nav>
    <main>
        <h2>Register</h2>
        <p>In order to contact with me, please register by form below.</p>
        <hr>
        <form>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" minlength="5" maxlength="30" required>
            <br>
            <br>    
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Enter your e-mail address" required>
            <br>
            <br>
            <label for="name">Name:</label>
            <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name">
            <br>
            <br>
            <label id="age" for="age">Age:</label>
            <input type="number" id="age" name="age" min="15" max="99">
            <br>
            <br>
            <label for="birthdate">Birth Date:</label>
            <input type="date" id="birthdate" name="birthdate">
            <hr>
            <p>Year of Study:</p>
            <input type="radio" id="year1" name="year" value="1">
            <label for="year1">1st Year</label>
            <input type="radio" id="year2" name="year" value="2">
            <label for="year2">2nd Year</label>
            <input type="radio" id="year3" name="year" value="3">
            <label for="year3">3rd Year</label>
            <input type="radio" id="year4" name="year" value="4">
            <label for="year4">4th Year</label>
            <br>
            <br>
            <p>Areas of Interest:</p>
            <input type="checkbox" id="web" name="interest" value="web">
            <label for="web">Web Development</label>
            <input type="checkbox" id="ai" name="interest" value="ai">
            <label for="ai">Artificial Intelligence</label>
            <input type="checkbox" id="sd" name="interest" value="sd">
            <label for="sd">Software Development</label>
            <br>
            <br>
            <label for="department">Department:</label>
            <select id="department" name="department">
            <option value="mis">Management Information Systems</option>
            <option value="business">Business Administration</option>
            <option value="economics">Economics</option>
            <option value="computer engineering">Computer Engineering</option>
            <option value="industrial engineering">Industrial Engineering</option>
            <option value="mathematics">Mathematics</option>
            </select>
            <hr>
            <label for="message">Message:</label>
            <textarea
            id="message"
            name="message"
            rows="10"
            cols="50">
            </textarea>
            <br>
            <br>
            <br>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>
    </main>
</body>

</footer>

</html>
